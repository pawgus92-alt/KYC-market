<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Золотой червонец">
  <defs>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#fff1b8"/>
      <stop offset="42%" stop-color="#e8c15a"/>
      <stop offset="78%" stop-color="#b8862d"/>
      <stop offset="100%" stop-color="#6e4c12"/>
    </radialGradient>
    <linearGradient id="rim" x1="20" y1="18" x2="142" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#d4a942"/>
      <stop offset="1" stop-color="#7a5614"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="74" fill="url(#rim)" filter="url(#soft)"/>
  <circle cx="80" cy="80" r="66" fill="url(#coinFace)"/>
  <circle cx="80" cy="80" r="62" fill="none" stroke="#5a3d0c" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="80" cy="80" r="56" fill="none" stroke="#fff3c4" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2.2 3.4"/>

  <!-- wheat sprigs -->
  <g fill="none" stroke="#5a3d0c" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
    <path d="M48 98c6-10 10-22 10-34"/>
    <path d="M48 80c4-2 8-2 12 0M46 88c4-2 8-2 12 0M50 72c4-2 8-1 11 1"/>
    <path d="M112 98c-6-10-10-22-10-34"/>
    <path d="M112 80c-4-2-8-2-12 0M114 88c-4-2-8-2-12 0M110 72c-4-2-8-1-11 1"/>
  </g>

  <text
    x="80"
    y="88"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="54"
    font-weight="700"
    fill="#3a2a08"
  >Ч</text>

  <text
    x="80"
    y="118"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="11"
    letter-spacing="1.5"
